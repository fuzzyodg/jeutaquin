<svg width="600" height="340" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" style="background:#fcfcfd; border:1px solid #d0d7de; border-radius:8px; margin:15px auto; display:block;">
  <defs>
    <marker id="w-k" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="w-e" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="w-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="300" y="26" text-anchor="middle" font-family="Times New Roman, serif" font-size="17" font-weight="bold" fill="#0f172a">Onde Électromagnétique Plane Harmonique 3D : Trièdre Direct (E, B, k)</text>

  <!-- Propagation Axis z -->
  <line x1="50" y1="180" x2="550" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#w-k)"/>
  <text x="560" y="185" font-family="Times New Roman, serif" font-size="16" font-weight="bold" fill="#1e293b">z (propagation k)</text>

  <!-- Vertical Axis x (Electric Field E) -->
  <line x1="80" y1="290" x2="80" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="50" font-family="Times New Roman, serif" font-size="15" font-weight="bold" fill="#2563eb">x (E)</text>

  <!-- Transverse Axis y (Magnetic Field B, isometric projection) -->
  <line x1="80" y1="180" x2="30" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="20" y="255" font-family="Times New Roman, serif" font-size="15" font-weight="bold" fill="#dc2626">y (B)</text>

  <!-- Sinusoidal E field (vertical) and B field (in inclined plane) -->
  <!-- wavelength = 200px, 2 cycles from x=80 to x=480 -->
  <!-- Drawing arrows for E and B along the wave -->
  <path d="M 80,180 L 80,180.0 L 85,170.6 L 90,161.5 L 95,152.8 L 100,144.7 L 105,137.6 L 110,131.5 L 115,126.5 L 120,122.9 L 125,120.7 L 130,120.0 L 135,120.7 L 140,122.9 L 145,126.5 L 150,131.5 L 155,137.6 L 160,144.7 L 165,152.8 L 170,161.5 L 175,170.6 L 180,180.0 L 185,189.4 L 190,198.5 L 195,207.2 L 200,215.3 L 205,222.4 L 210,228.5 L 215,233.5 L 220,237.1 L 225,239.3 L 230,240.0 L 235,239.3 L 240,237.1 L 245,233.5 L 250,228.5 L 255,222.4 L 260,215.3 L 265,207.2 L 270,198.5 L 275,189.4 L 280,180.0 L 285,170.6 L 290,161.5 L 295,152.8 L 300,144.7 L 305,137.6 L 310,131.5 L 315,126.5 L 320,122.9 L 325,120.7 L 330,120.0 L 335,120.7 L 340,122.9 L 345,126.5 L 350,131.5 L 355,137.6 L 360,144.7 L 365,152.8 L 370,161.5 L 375,170.6 L 380,180.0 L 385,189.4 L 390,198.5 L 395,207.2 L 400,215.3 L 405,222.4 L 410,228.5 L 415,233.5 L 420,237.1 L 425,239.3 L 430,240.0 L 435,239.3 L 440,237.1 L 445,233.5 L 450,228.5 L 455,222.4 L 460,215.3 L 465,207.2 L 470,198.5 L 475,189.4 L 480,180.0 L 485,170.6 L 490,161.5 L 495,152.8 " fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M 80,180 L 80.0,180.0 L 80.6,183.1 L 81.3,186.2 L 82.3,189.1 L 83.5,191.8 L 85.2,194.1 L 87.3,196.2 L 90.1,197.8 L 93.4,199.0 L 97.3,199.8 L 102.0,200.0 L 107.3,199.8 L 113.4,199.0 L 120.1,197.8 L 127.3,196.2 L 135.2,194.1 L 143.5,191.8 L 152.3,189.1 L 161.3,186.2 L 170.6,183.1 L 180.0,180.0 L 189.4,176.9 L 198.7,173.8 L 207.7,170.9 L 216.5,168.2 L 224.8,165.9 L 232.7,163.8 L 239.9,162.2 L 246.6,161.0 L 252.7,160.2 L 258.0,160.0 L 262.7,160.2 L 266.6,161.0 L 269.9,162.2 L 272.7,163.8 L 274.8,165.9 L 276.5,168.2 L 277.7,170.9 L 278.7,173.8 L 279.4,176.9 L 280.0,180.0 L 280.6,183.1 L 281.3,186.2 L 282.3,189.1 L 283.5,191.8 L 285.2,194.1 L 287.3,196.2 L 290.1,197.8 L 293.4,199.0 L 297.3,199.8 L 302.0,200.0 L 307.3,199.8 L 313.4,199.0 L 320.1,197.8 L 327.3,196.2 L 335.2,194.1 L 343.5,191.8 L 352.3,189.1 L 361.3,186.2 L 370.6,183.1 L 380.0,180.0 L 389.4,176.9 L 398.7,173.8 L 407.7,170.9 L 416.5,168.2 L 424.8,165.9 L 432.7,163.8 L 439.9,162.2 L 446.6,161.0 L 452.7,160.2 L 458.0,160.0 L 462.7,160.2 L 466.6,161.0 L 469.9,162.2 L 472.7,163.8 L 474.8,165.9 L 476.5,168.2 L 477.7,170.9 L 478.7,173.8 L 479.4,176.9 L 480.0,180.0 L 480.6,183.1 L 481.3,186.2 L 482.3,189.1 " fill="none" stroke="#dc2626" stroke-width="2.5"/>
<line x1="130" y1="180" x2="130" y2="120.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#w-e)"/>
<line x1="130" y1="180" x2="102.0" y2="200.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#w-b)"/>
<line x1="230" y1="180" x2="230" y2="240.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#w-e)"/>
<line x1="230" y1="180" x2="258.0" y2="160.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#w-b)"/>
<line x1="330" y1="180" x2="330" y2="120.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#w-e)"/>
<line x1="330" y1="180" x2="302.0" y2="200.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#w-b)"/>
<line x1="430" y1="180" x2="430" y2="240.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#w-e)"/>
<line x1="430" y1="180" x2="458.0" y2="160.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#w-b)"/>

  <line x1="130" y1="110" x2="330" y2="110" stroke="#475569" stroke-width="1.5"/>
  <line x1="130" y1="105" x2="130" y2="115" stroke="#475569" stroke-width="1.5"/>
  <line x1="330" y1="105" x2="330" y2="115" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="103" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-weight="bold" fill="#0f172a">Longueur d'onde λ = c / f</text>

  <!-- Poynting vector Pi -->
  <rect x="420" y="45" width="165" height="85" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="430" y="65" font-family="Times New Roman, serif" font-size="12" font-weight="bold" fill="#0f172a">Vecteur de Poynting :</text>
  <text x="430" y="83" font-family="Times New Roman, serif" font-size="12" fill="#2563eb">• Π = (E ∧ B) / μ₀</text>
  <text x="430" y="101" font-family="Times New Roman, serif" font-size="12" fill="#dc2626">• B₀ = E₀ / c</text>
  <text x="430" y="119" font-family="Times New Roman, serif" font-size="12" fill="#334155">• E ⟂ B ⟂ k (Onde transverse)</text>
</svg>